version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: flip123
      POSTGRES_DB: flipdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flip -d flipdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://flip:flip123@db:5432/flipdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: